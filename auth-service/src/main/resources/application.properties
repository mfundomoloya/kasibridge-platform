server.port=8084
spring.application.name=auth-service

kasibridge.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false


management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

kasibridge.security.jwt.private-key-location=${JWT_PRIVATE_KEY_LOCATION}
kasibridge.security.jwt.public-key-location=${JWT_PUBLIC_KEY_LOCATION}
kasibridge.security.jwt.expiration-ms=3600000
