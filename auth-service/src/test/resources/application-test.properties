spring.datasource.url=jdbc:h2:mem:kasibridge_auth_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=false

kasibridge.security.jwt.private-key-location=classpath:keys/test-private.pem
kasibridge.security.jwt.public-key-location=classpath:keys/test-public.pem
kasibridge.security.jwt.expiration-ms=3600000

kasibridge.security.cors.allowed-origins=http://localhost:5173

management.endpoints.web.exposure.include=health,info