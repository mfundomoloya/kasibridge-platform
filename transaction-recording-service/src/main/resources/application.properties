#Server
server.port=8082
spring.application.name=transaction-recording-service

spring.datasource.url=jdbc:postgresql://localhost:5432/kasibridge_transactions
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=@pass123


#H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

#JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


#Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

#Trader Profile Service URL
# Used to verify trader exists before recording a transaction
kasibidge.trader-profile.base-url=http://localhost:8081