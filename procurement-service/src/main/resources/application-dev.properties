# Use local service endpoints.
kasibridge.services.trader-profile.base-url=http://localhost:8081
kasibridge.services.auth.base-url=http://localhost:8084
kasibridge.security.cors.allowed-origins=http://localhost:5173

# Use the local PostgreSQL database.
spring.datasource.url=jdbc:postgresql://localhost:5432/kasibridge_procurement
spring.datasource.username=postgres
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=validate

# Never contact Meta from the development profile.
kasibridge.notifications.mock-whatsapp.enabled=true
kasibridge.notifications.mock-whatsapp.force-failure=false
kasibridge.notifications.whatsapp.enabled=false
kasibridge.notifications.dispatch.enabled=false

# Local development account created by DevUserSeeder.
# Never activate the dev profile in a deployed environment.
kasibridge.internal.system.username=procurement-system
kasibridge.internal.system.password=${KASIBRIDGE_SYSTEM_PASSWORD}