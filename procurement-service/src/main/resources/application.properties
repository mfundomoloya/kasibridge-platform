server.port=8085
spring.application.name=procurement-service
kasibridge.services.trader-profile.base-url=http://localhost:8081
kasibridge.services.auth.base-url=http://localhost:8084
kasibridge.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

kasibridge.internal.system.username=${KASIBRIDGE_SYSTEM_USERNAME}
kasibridge.internal.system.password=${KASIBRIDGE_SYSTEM_PASSWORD}

spring.datasource.url=jdbc:postgresql://localhost:5432/kasibridge_procurement
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

kasibridge.internal.system.token-refresh-skew-seconds=60
kasibridge.ticket-ai.auto-assessment.enabled=true

kasibridge.security.jwt.public-key-location=${JWT_PUBLIC_KEY_LOCATION}

kasibridge.notifications.dispatch.enabled=false
kasibridge.notifications.dispatch.batch-size=20
kasibridge.notifications.max-retries=3
kasibridge.notifications.retry.base-delay-seconds=${NOTIFICATION_RETRY_BASE_DELAY_SECONDS:60}
kasibridge.notifications.retry.max-delay-seconds=${NOTIFICATION_RETRY_MAX_DELAY_SECONDS:3600}

kasibridge.notifications.mock-whatsapp.force-failure=false
kasibridge.notifications.mock-whatsapp.enabled=${MOCK_WHATSAPP_ENABLED:false}

# Real WhatsApp Cloud API provider
kasibridge.notifications.whatsapp.enabled=${WHATSAPP_ENABLED:true}
kasibridge.notifications.whatsapp.graph-api-base-url=${WHATSAPP_GRAPH_API_BASE_URL:https://graph.facebook.com}
kasibridge.notifications.whatsapp.api-version=${WHATSAPP_API_VERSION:}
kasibridge.notifications.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
kasibridge.notifications.whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
kasibridge.notifications.whatsapp.webhook.verify-token=${WHATSAPP_WEBHOOK_VERIFY_TOKEN:}
kasibridge.notifications.whatsapp.webhook.app-secret=${WHATSAPP_APP_SECRET:}