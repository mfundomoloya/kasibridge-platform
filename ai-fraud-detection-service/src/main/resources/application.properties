server.port=8083
spring.application.name=ai-fraud-detection-service

spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
kasibridge.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=fraud
spring.flyway.default-schema=fraud
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.jpa.properties.hibernate.default_schema=fraud

kasibridge.security.jwt.public-key-location=${JWT_PUBLIC_KEY_LOCATION}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

kasibridge.trader-profile.base-url=${TRADER_PROFILE_BASE_URL}
kasibridge.transaction.base-url=${TRANSACTION_BASE_URL}

kasibridge.fraud.ml.base-url=${KASIBRIDGE_FRAUD_ML_BASE_URL}
kasibridge.fraud.ml.connect-timeout-ms=${KASIBRIDGE_FRAUD_ML_CONNECT_TIMEOUT_MS:2000}
kasibridge.fraud.ml.read-timeout-ms=${KASIBRIDGE_FRAUD_ML_READ_TIMEOUT_MS:5000}

#Fraud Detection Thresholds
#Transactions captured more than 60 mins after they occurred = suspicious
kasibridge.fraud.backdated-threshold-minutes=60

# Transactions above R50,000 trigger high-value review
kasibridge.fraud.high-value-threshold=50000

# Two identical transactions within 5 mins = possible duplicate
kasibridge.fraud.duplicate-window-minutes=5

# More than 3 flagged transactions = high risk trader
kasibridge.fraud.high-risk-flag-count=3

springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:false}  